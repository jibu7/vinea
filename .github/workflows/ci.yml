name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: vinea, POSTGRES_PASSWORD: vinea, POSTGRES_DB: vinea }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vinea" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vinea:vinea@localhost:5432/vinea
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # WeasyPrint renders the AR/AP statement PDFs (P4). Without these the import fails and
      # the statement job would only ever be recorded as failed — never skipped, but the
      # failure would look like a product bug rather than a missing library.
      - name: install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libffi8 \
            fonts-dejavu-core
      - run: uv sync
      - name: prove WeasyPrint imports
        run: uv run python -c "import weasyprint; print('weasyprint', weasyprint.__version__)"
      - run: uv run ruff check .
      - run: uv run pytest -q
      # Named explicitly so the log shows the PDF path executing. `-p no:randomly` keeps the
      # node ids stable and `--no-header -rA` prints PASSED lines rather than dots, so a
      # silently-deselected test is visible as a missing line.
      - name: prove the statement PDF tests ran
        run: |
          uv run pytest -p no:randomly --no-header -rA \
            tests/subledger/test_reports.py::test_statement_job_produces_a_pdf \
            tests/subledger/test_reports.py::test_statement_html_renders_open_items \
            tests/subledger/test_api.py::test_statement_job_downloads_a_pdf
      - run: uv run alembic upgrade head   # migration-from-zero gate
      - run: uv run alembic check          # models and migrations must not drift apart

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      # e2e: bring up the real stack (docker-compose.yml — db + backend + frontend, same
      # images/env dev uses) and run Playwright against it, per P3 step 8.
      - name: start database
        run: docker compose up -d --wait db
        working-directory: .
      - name: build backend and frontend images
        run: docker compose build backend frontend
        working-directory: .
      - name: apply migrations
        run: docker compose run --rm backend uv run alembic upgrade head
        working-directory: .
      - name: start backend and frontend
        run: docker compose up -d backend frontend
        working-directory: .
      - name: wait for backend and frontend
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3000/login
          # `next dev` compiles each route on its first hit — front-load that cost here,
          # outside any single Playwright test's timeout budget.
          for route in / /gl/journal-batches/new /gl/enquiries/account /gl/enquiries/trial-balance /maintenance/chart-of-accounts; do
            curl -sf -o /dev/null "http://localhost:3000${route}" || true
          done
        working-directory: .
      - name: seed e2e fixtures
        run: docker compose exec -T backend uv run python -m app.scripts.seed_e2e
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:8000
      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: upload print-preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-preview-screenshots
          path: frontend/screenshots/
          retention-days: 7

      # `make db-reset` (drop the dev Postgres volume, migrate, seed) only ever ran by hand
      # before — exercise it here so a break in it (e.g. init-app-role.sql drifting from the
      # RLS-enforced app role) fails CI instead of surfacing on someone's laptop. Re-running
      # e2e:regression afterward is the actual proof the reset DB is back to seed state: it
      # needs a real login and the seeded 6100 account, so it fails if either is missing.
      - name: reset dev DB (make db-reset)
        run: make db-reset
        working-directory: .
      - name: wait for backend and frontend after reset
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3000/login
          # `make db-reset` recreates the frontend container, so `next dev`'s per-route compile
          # cache (an anonymous volume, not persisted) is gone too — warm the routes
          # e2e:regression hits next, same as the earlier "wait for backend and frontend" step,
          # or its first navigation eats the compile cost against Playwright's fixed 30s
          # waitForURL default instead of this loop's much longer budget.
          for route in / /gl/journal-batches/new; do
            curl -sf -o /dev/null "http://localhost:3000${route}" || true
          done
        working-directory: .
      - name: confirm reset DB is back to seed state
        run: npm run e2e:regression
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:8000
      - name: docker compose logs
        if: failure()
        run: docker compose logs --tail=200
        working-directory: .
      - name: tear down stack
        if: always()
        run: docker compose down -v
        working-directory: .
