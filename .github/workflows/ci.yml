name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: vinea, POSTGRES_PASSWORD: vinea, POSTGRES_DB: vinea }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vinea" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The suite reads MIGRATION_DATABASE_URL for its admin work (creating the throwaway
      # databases, running migrations) and overwrites DATABASE_URL at conftest import with
      # the non-superuser app role, so RLS is actually enforced in the tests.
      DATABASE_URL: postgresql+psycopg://vinea:vinea@localhost:5432/vinea
      MIGRATION_DATABASE_URL: postgresql+psycopg://vinea:vinea@localhost:5432/vinea
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Keyed on the lockfile: a run that resolves the same dependencies restores them
          # rather than downloading them again.
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # WeasyPrint renders the AR/AP statement PDFs (P4). Without these the import fails and
      # the statement job would only ever be recorded as failed — never skipped, but the
      # failure would look like a product bug rather than a missing library.
      - uses: ./.github/actions/drop-vendor-apt-sources
      - name: install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libffi8 \
            libglib2.0-0 fonts-dejavu-core
      - run: uv sync
      - name: prove WeasyPrint imports
        run: uv run python -c "import weasyprint; print('weasyprint', weasyprint.__version__)"
      - run: uv run ruff check .
      # `-n auto` — one worker per core. The suite was already built for this: `conftest.py`
      # names its database `vinea_test_<pid>` and every xdist worker is its own process, so
      # each gets its own database, its own migration run and its own session fixture. What
      # made the serial run long was that per-process migration, and it now happens on every
      # core at once instead of on one.
      #
      # Nothing is skipped, deselected or marked: the item count is identical to the serial
      # run's, which is the only thing that makes this a speed-up rather than a smaller suite.
      #
      # `auto` here and a **cap** in the Makefile (`PYTEST_WORKERS ?= 4`) is not an
      # inconsistency: a GitHub-hosted runner has 4 cores, so the two are the same number, and
      # the cap exists for developer machines with sixteen. If this job ever moves to a larger
      # runner it will meet the same wall the cap was added for — every worker's migration run
      # takes its locks from one cluster-wide table sized by `max_locks_per_transaction` — and
      # the fix is to name a number here too, not to raise the limit.
      - run: uv run pytest -n auto -q
      # Named explicitly so the log shows the PDF path executing. `-p no:randomly` keeps the
      # node ids stable and `--no-header -rA` prints PASSED lines rather than dots, so a
      # silently-deselected test is visible as a missing line.
      - name: prove the statement PDF tests ran
        # Serial on purpose: three named node ids, where the point is reading PASSED lines in
        # order, not speed. `-n auto` would scatter them across workers for no gain.
        run: |
          uv run pytest -p no:randomly --no-header -rA \
            tests/subledger/test_reports.py::test_statement_job_produces_a_pdf \
            tests/subledger/test_reports.py::test_statement_html_renders_open_items \
            tests/subledger/test_api.py::test_statement_job_downloads_a_pdf
      - run: uv run alembic upgrade head   # migration-from-zero gate
      - run: uv run alembic check          # models and migrations must not drift apart

  # The frontend's own checks, split out of the e2e job so that a lint error is reported in
  # under two minutes instead of behind the e2e run, and so the e2e shards do not each repeat
  # them.
  frontend-checks:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `ci`, not `install`: the checks have to run against the tree the lockfile pins, or
      # "green on this branch" means green on a tree nobody committed. See the note in the
      # e2e job for the version of this that bites hardest.
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # e2e: the real stack (docker-compose.yml — db + backend + frontend, the same images and
  # env dev uses) with Playwright against it, per P3 step 8 — now in **six parallel groups**.
  #
  # Each shard is a whole job on its own runner: its own compose stack, its own Postgres
  # volume, its own seed. That is the reset-database rule enforced by the shape of the job
  # rather than by discipline — a spec that only passes because another file wrote its rows
  # fails here, and the fix is the spec, not the sharding.
  #
  # Files stay whole and `fullyParallel` stays false, so ordering *within* a file is unchanged
  # and no spec had to be touched to make this work.
  e2e:
    name: e2e (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two heaviest parts of the suite, each on its own runner. `--shard` splits by
          # **test count and not by time**, and these two are both slow and adjacent
          # alphabetically — so every count-balanced split of three put them in the same shard
          # and left it carrying most of the suite's wall clock while the other two idled.
          # Naming them is what makes the remaining three shards mean anything.
          #
          # No timings here on purpose: a measurement in a comment is a measurement nobody
          # re-takes, and this one was still quoting a run from three PRs back. They belong in
          # the body of whichever PR moved them.
          #
          # The a11y group is **five files and `--workers=4`** (P6 step 9). It was one file
          # holding one test per intent, each sweeping thirty-odd screens in sequence, and a
          # loop inside a test is not something Playwright can spread: the group ran on one
          # worker whatever the runner had. One test per route, in files that declare
          # `mode: "parallel"`, is what lets the four cores do four screens at once. The
          # workers flag is here rather than in `playwright.config.ts` because every other
          # group's specs share seeded fixtures and are written for `workers: 1`; this is the
          # one group whose tests touch nothing but the screen they open.
          #
          # Kept on **one line**, deliberately: `ci-e2e-groups.test.ts` reads these values with
          # a line regex, and a YAML block scalar hands it `>-` instead of the file names. The
          # five files would then look named by nobody and matched by the shard filter, which
          # is the double-run this partition test exists to catch — and the test would have
          # reported green over it.
          - group: a11y
            args: --workers=4 e2e/accessibility-dashboard.spec.ts e2e/accessibility-maintenance.spec.ts e2e/accessibility-transactions.spec.ts e2e/accessibility-enquiries.spec.ts e2e/accessibility-reports.spec.ts
          - group: tape
            args: e2e/ar-ap-acceptance.spec.ts
          # The P8 tape on a runner of its own (P8 step 9): one serial file that signs up its own
          # company and walks the phase's nineteen rows and the owner's real exports through the
          # screens, several hundred statement lines among them. Named here so the shards keep
          # meaning a split of the rest.
          - group: p8-tape
            args: e2e/p8-cycle-tape.spec.ts
          # Everything else, count-sharded three ways as intended — the heavy files excluded by
          # a path filter rather than by a list of the ones to include, so a new spec file joins
          # a shard by existing. Nothing selects tests by title: the filter is on the path.
          # `frontend/src/lib/ci-e2e-groups.test.ts` proves the partition — every spec file is
          # named by a group or left in by this filter, exactly one of the two.
          - group: rest-1
            args: --shard=1/3 "^(?!.*(?:accessibility-\\w+|ar-ap-acceptance|p8-cycle-tape)\\.spec\\.ts).*$"
          - group: rest-2
            args: --shard=2/3 "^(?!.*(?:accessibility-\\w+|ar-ap-acceptance|p8-cycle-tape)\\.spec\\.ts).*$"
          # The extras ride here: `rest-3` is the lightest group, and they need a live stack.
          - group: rest-3
            args: --shard=3/3 "^(?!.*(?:accessibility-\\w+|ar-ap-acceptance|p8-cycle-tape)\\.spec\\.ts).*$"
            extras: "yes"
    defaults: { run: { working-directory: frontend } }
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Layer the e2e overlay onto every `docker compose` in this job — including the ones
      # `make db-reset` runs — rather than repeating `-f` at eight call sites and having the
      # ninth forget. It adds exactly one setting, the mail catcher the suite reads one-time
      # tokens from; see docker-compose.e2e.yml.
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `ci`, not `install`, and this is the job where it matters most. Two dependency trees
      # meet here: the one baked into the frontend image by `docker compose build` and this
      # one, which is where Playwright itself comes from. The browser download below is cached
      # under `hashFiles('frontend/package-lock.json')` — so the cache key says "the
      # `@playwright/test` the lockfile pins" while an `npm install` was free to resolve a
      # different one, and a browser build restored for a version that is not the installed
      # one fails as a test failure, not as an install failure. Installing the lockfile
      # exactly is what makes the key true.
      - run: npm ci --no-audit --no-fund

      # The e2e fixture credential. Generated per run rather than written down anywhere: the
      # seed hashes it and the suite signs in with it, and neither has a literal to fall back
      # to (P4 step 9). It has to exist before the seed step, and reach both the container
      # that seeds and the Playwright process that logs in.
      - name: generate the e2e fixture credential
        run: echo "E2E_PASSWORD=$(openssl rand -base64 24)" >> "$GITHUB_ENV"

      - name: start database
        run: docker compose up -d --wait db
        working-directory: .
      # Not layer-cached, and that is the next lever if this job needs one. A `type=gha` cache
      # would remove the build, but it needs the `docker-container` builder, and whether
      # `docker compose build` then loads the image into the engine for `up` is exactly the
      # kind of thing that has to be watched on a real runner — which the branch that added
      # this could not do. So it was not shipped unverified on a required check.
      - name: build backend and frontend images
        run: docker compose build backend frontend
        working-directory: .
      - name: apply migrations
        run: docker compose run --rm backend uv run alembic upgrade head
        working-directory: .
      - name: start backend and frontend
        run: docker compose up -d backend frontend
        working-directory: .
      - name: wait for backend and frontend
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3000/login
          # `next dev` compiles each route on its first hit — front-load that cost here,
          # outside any single Playwright test's timeout budget. The list is generated from
          # `nav-tree.ts` rather than typed out here: the hand-kept version had drifted to
          # about half the tree, which is the same drift issue #9 found in the axe coverage,
          # and the nav sweep visits all of it.
          #
          # Eight at a time rather than one after another: each shard pays this warm-up, and
          # the routes are independent of each other. `next dev` compiles them concurrently;
          # the loop was waiting on one compile at a time for no reason.
          (cd frontend && npx tsx scripts/nav-routes.ts) \
            | xargs -P 8 -I{} curl -sf -o /dev/null "http://localhost:3000{}" || true
        working-directory: .
      # `-e E2E_PASSWORD` rather than a compose entry: the value is this job's, and nothing in
      # the running app needs it — only the seed does.
      - name: seed e2e fixtures
        run: docker compose exec -e E2E_PASSWORD -T backend uv run python -m app.scripts.seed_e2e
        working-directory: .
      # `--with-deps` shells out to apt-get, so the vendor sources have to be gone first.
      - uses: ./.github/actions/drop-vendor-apt-sources
      # `pdftotext` — the discount tape reads the statement PDF it downloads, to check the
      # figure reached the document rather than that a file arrived.
      - name: install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # Keyed on the lockfile, which is what pins the Playwright version the browser build
      # has to match. A miss just downloads it as before.
      - name: cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      # Both halves of the P4 step 9 tape have to be *there* before the suite runs. A spec that
      # fails to compile, or whose describe block stops producing tests, is otherwise a silently
      # shorter run that still reports green. `--list` sees the whole suite, not this shard,
      # so one shard asking is enough.
      - name: prove the acceptance tape is collected
        if: matrix.group == 'tape'
        run: |
          npx playwright test e2e/ar-ap-acceptance.spec.ts --list | tee /tmp/tape.txt
          grep -q "AR · USD" /tmp/tape.txt
          grep -q "AR · RWF" /tmp/tape.txt
          grep -q "AP · USD" /tmp/tape.txt
          grep -q "journal batch raises a debit that ages" /tmp/tape.txt
          grep -q "AR — a settlement discount" /tmp/tape.txt
          grep -q "AP — a settlement discount" /tmp/tape.txt
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:8000
      - name: playwright (${{ matrix.group }})
        run: npx playwright test ${{ matrix.args }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:8000
      # The two halves of `npm run e2e` that are not Playwright specs. They are not sharded —
      # each is a single script — so they run once, on the first shard, rather than three
      # times over.
      - name: the amount-overwrite regression and the print previews
        if: matrix.extras == 'yes'
        run: npm run e2e:regression && npm run e2e:print-preview
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:8000
      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.group }}
          path: frontend/playwright-report/
          retention-days: 7
      - name: upload print-preview screenshots
        if: always() && matrix.extras == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: print-preview-screenshots
          path: frontend/screenshots/
          retention-days: 7

      # `make db-reset` (drop the dev Postgres volume, migrate, seed) only ever ran by hand
      # before — exercise it here so a break in it (e.g. init-app-role.sql drifting from the
      # RLS-enforced app role) fails CI instead of surfacing on someone's laptop. Re-running
      # e2e:regression afterward is the actual proof the reset DB is back to seed state: it
      # needs a real login and the seeded 6100 account, so it fails if either is missing.
      # One shard proves it; the reset is a property of the repo, not of the shard.
      - name: reset dev DB (make db-reset)
        if: matrix.extras == 'yes'
        run: make db-reset          # reseeds, so it needs E2E_PASSWORD from the job env
        working-directory: .
      - name: wait for backend and frontend after reset
        if: matrix.extras == 'yes'
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/login && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3000/login
          # `make db-reset` recreates the frontend container, so `next dev`'s per-route compile
          # cache (an anonymous volume, not persisted) is gone too — warm the routes
          # e2e:regression hits next, same as the earlier "wait for backend and frontend" step,
          # or its first navigation eats the compile cost against Playwright's fixed 30s
          # waitForURL default instead of this loop's much longer budget.
          for route in / /gl/journal-batches/new; do
            curl -sf -o /dev/null "http://localhost:3000${route}" || true
          done
        working-directory: .
      - name: confirm reset DB is back to seed state
        if: matrix.extras == 'yes'
        run: npm run e2e:regression
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:8000
      - name: docker compose logs
        if: failure()
        run: docker compose logs --tail=200
        working-directory: .
      - name: tear down stack
        if: always()
        run: docker compose down -v
        working-directory: .

  # The required check, and the only reason this job exists: branch protection names one
  # frontend check, and there are now four jobs behind it. `if: always()` with an explicit
  # look at each result, because a job that is *skipped* when one of its `needs` fails would
  # report as neither failed nor passed — which is how a red suite becomes a green tick.
  frontend:
    runs-on: ubuntu-latest
    needs: [frontend-checks, e2e]
    if: always()
    steps:
      - name: every frontend job succeeded
        run: |
          checks='${{ needs.frontend-checks.result }}'
          e2e='${{ needs.e2e.result }}'
          echo "frontend-checks: $checks"
          echo "e2e (all shards): $e2e"
          test "$checks" = success || exit 1
          test "$e2e" = success || exit 1
