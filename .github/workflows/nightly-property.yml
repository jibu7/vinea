name: Nightly property run

# The Hypothesis `deep` profile (300 examples) against `main`. Per-commit CI runs the `ci`
# profile — 2 examples — so the suite stays under a minute; depth is what this buys. It is
# deliberately **not** a required check: it gates nothing and blocks no merge. A failure
# opens an issue, because a property failure found at 300 examples is a real defect that a
# red tick nobody is watching would lose.
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deep:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: vinea, POSTGRES_PASSWORD: vinea, POSTGRES_DB: vinea }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vinea" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vinea:vinea@localhost:5432/vinea
      HYPOTHESIS_PROFILE: deep
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # `-m slow` is the property suite. `--hypothesis-show-statistics` puts the example
      # count and the shrink in the log, so a run that silently degraded to the fast profile
      # is visible rather than passing quietly.
      # `-s` so the census `print`s reach the log: pytest captures stdout by default, and the
      # counters are printed from a module-scoped fixture at teardown, which capture swallows
      # on a passing run — the run where they are most worth having.
      - name: deep property run
        id: deep
        run: |
          set -o pipefail
          uv run pytest -m slow -q -s -p no:randomly --no-header -rA \
            --hypothesis-show-statistics 2>&1 | tee deep.log
      # The census, where somebody will actually see it.
      #
      # `_REFUSALS` and `_REACH` in `tests/order_entry/test_property_order.py` say how often the
      # deep pass provoked each refusal and how far the machine got towards the ones that need a
      # chain of operations. They were printed into a log nobody opens unless the run is red —
      # which is backwards, because the number that matters most is the one on a **green** run:
      # a guard reached three times by luck is a guard the next seed may not reach at all.
      #
      # P6 closed asking whoever next touched this to pick `max_examples` against these counters
      # (final report, F-9.10). Putting them on the run summary is what makes that possible
      # without re-running anything.
      - name: put the census on the run summary
        if: always()
        run: |
          {
            echo '## Property census'
            echo
            if grep -q '\[property\]' deep.log; then
              echo '```'
              grep '\[property\]' deep.log
              echo '```'
              echo
              echo 'Floors are enforced on the three refusals a single drawn operation can'
              echo 'provoke. The other five are covered by construction in'
              echo '`tests/order_entry/test_property_targeted_refusals.py` — if one of those'
              echo 'reads low here it is information, not a failure.'
              echo
              echo 'The `reach` lines are the ones to read on a green run. A refusal at zero'
              echo 'whose matching reach counter is also at zero means the machine never asked'
              echo 'for it, which is a coverage gap and not a regression — that is how'
              echo '`receipt_exceeds_order` was diagnosed and moved.'
            else
              echo 'No census lines in the log: the property module did not run, or the run'
              echo 'degraded to a profile below 100 examples.'
            fi
            echo
            echo '## Example counts'
            echo
            echo '```'
            grep -E 'max_examples|passing examples' deep.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-property-log
          path: backend/deep.log
          retention-days: 30
      - name: open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Nightly property run failed (HYPOTHESIS_PROFILE=deep)';
            // One open issue, not one per night: reopen/comment on the standing one instead.
            const { data: existing } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'nightly-property', per_page: 1,
            });
            const body = [
              `The deep property run failed on \`main\` at ${context.sha.slice(0, 7)}.`,
              '',
              `Run: ${run}`,
              '',
              'Hypothesis prints the shrunk counterexample in the job log and in the',
              '`deep-property-log` artifact. Reproduce locally with:',
              '',
              '```',
              'cd backend && HYPOTHESIS_PROFILE=deep uv run pytest -m slow -q',
              '```',
            ].join('\n');
            if (existing.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['nightly-property'],
              });
            }
