name: Copilot Setup Steps
on: [workflow_dispatch]
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: vinea, POSTGRES_PASSWORD: vinea, POSTGRES_DB: vinea }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vinea" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vinea:vinea@localhost:5432/vinea
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd backend && uv sync
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd frontend && npm install --no-audit --no-fund
