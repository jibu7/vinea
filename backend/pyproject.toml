[project]
name = "vinea-backend"
version = "0.1.0"
description = "Vinea ERP backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "weasyprint>=70.0",
  # P7. `httpx` is the EBM transport and moves out of the dev group: the adapter imports it at
  # runtime, and a runtime dependency listed as a test one is an image that works until the
  # day it is built without dev extras. `cryptography` is Fernet, for the three device keys.
  "httpx>=0.27",
  "cryptography>=43",
  # P8. The bank-statement import takes the file the user picked, as multipart — not a base64
  # field in a JSON body. `file_sha256` is the refusal that catches the same export twice and
  # has to be over the bytes the bank produced, and the preview and the import must agree
  # about what those bytes are; a re-encoding step between the two is exactly where a BOM or a
  # line ending gets lost. FastAPI needs this package to read a `File()` at all.
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.6", "hypothesis>=6.100"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)`.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "app.core.permissions.require",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: hypothesis / long-running invariant suite",
  "concurrency: threaded tests that need real DB connections",
]
