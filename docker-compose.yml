services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vinea, POSTGRES_PASSWORD: vinea, POSTGRES_DB: vinea }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vinea"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: vinea, MINIO_ROOT_PASSWORD: vinea-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  backend:
    build: ./backend
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://vinea:vinea@db:5432/vinea
      REDIS_URL: redis://redis:6379/0
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: ./frontend
    command: npm run dev
    environment: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    volumes: ["./frontend:/app", "/app/node_modules", "/app/.next"]
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: { pgdata: {}, miniodata: {} }
