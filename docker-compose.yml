services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vinea, POSTGRES_PASSWORD: vinea, POSTGRES_DB: vinea }
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-app-role.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vinea"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: vinea, MINIO_ROOT_PASSWORD: vinea-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  backend:
    build: ./backend
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://vinea_app:vinea_app@db:5432/vinea
      MIGRATION_DATABASE_URL: postgresql+psycopg://vinea:vinea@db:5432/vinea
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-only-insecure-secret-change-me
      COOKIE_SECURE: "false"
      REPO_ROOT: /repo
      # The mount is owned by the host user, so git's dubious-ownership check refuses it.
      # Declared through the environment rather than baked into the image: it is true of this
      # bind mount, not of the container.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /repo
    # The e2e fixture credentials, so `seed_e2e` reads them from the environment rather than
    # carrying them as literals. Anything already exported wins (compose resolves the host
    # environment after env_file).
    env_file: [./e2e.env]
    volumes:
      - ./backend:/app
      # Read-only, and only so the schema-invariant test that shells out to git has a work
      # tree to ask. Without it that test cannot run in the container at all, and a locally
      # green suite would be green for a reason CI's is not.
      - .:/repo:ro
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  frontend:
    build: ./frontend
    command: npm run dev
    environment: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    volumes: ["./frontend:/app", "/app/node_modules", "/app/.next"]
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: { pgdata: {}, miniodata: {} }
